{{ define "main" }}
<div class="timeline-page">
  <h1 class="timeline-page-title">今日行程</h1>
  <p class="timeline-page-sub">从寅时末到亥时末，十八个节点，一日长安</p>

  <div class="timeline">
    {{ range .Params.items }}
    <div class="timeline-item">
      <div class="timeline-time">
        <span class="timeline-tc">{{ .time_tc }}</span>
        <span class="timeline-m">{{ .time_m }}</span>
      </div>
      <div class="timeline-dot"></div>
      <div class="timeline-body">
        <div class="timeline-head">
          <span class="timeline-emoji">{{ .emoji }}</span>
          <span class="timeline-title">{{ .title }}</span>
        </div>
        <p class="timeline-desc">{{ .desc }}</p>
        <p class="timeline-tagline">「{{ .tagline }}」</p>
      </div>
    </div>
    {{ end }}
  </div>

  <div style="text-align:center;margin-top:4rem">
    <a href="/routes/" class="btn btn-primary">选择专属路线 →</a>
  </div>
</div>
{{ end }}
