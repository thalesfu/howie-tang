      <stop offset="0%" stop-color="#070E1C"/>
      <stop offset="55%" stop-color="#111E36"/>
      <stop offset="100%" stop-color="#1E2F4A"/>
    </linearGradient>
    <radialGradient id="moon-halo" cx="72%" cy="18%" r="22%">
