    <radialGradient id="star-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E8D5A3" stop-opacity="1"/>
      <stop offset="100%" stop-color="#E8D5A3" stop-opacity="0"/>
