items:
  - time_tc: 寅时末
    time_m: "04:45"
    emoji: "🔔"
    title: 集合出发
    desc: 换上素色中衣，领取今日专属「唐人名牌」（你的唐代名字），与同伴在坊门口集合
    tagline: 今天起，你叫王九郎

  - time_tc: 卯时
    time_m: "05:00"
    emoji: "🪮"
    title: 梳妆·着装
    desc: 女生梳高髻、贴花钿、上薄妆；男生束发、戴幞头、系革带，全程由造型师协助，完成后专属写真打卡
    tagline: 镜中人已不是现代人

  - time_tc: 卯时末
    time_m: "06:30"
    emoji: "👘"
    title: 全套亮相
    desc: 男着圆领袍配皂靴，女着齐胸襦裙配披帛，造型师最终检查调整，集体合照留念
    tagline: 穿上它的瞬间，长安才真实

  - time_tc: 辰时
    time_m: "07:00"
    emoji: "🫓"
    title: 朝食
    desc: 芝麻胡饼（唐代肉夹馍）、粟米粥、豆豉小菜、蒸饼，配一碗煎茶，坐在坊内食摊上吃
    tagline: 大唐打工人的第一口碳水

  - time_tc: 辰时中
    time_m: "08:00"
    emoji: "📜"
    title: 晨课·飞花令热身
    desc: 以「春」「月」「酒」为令，桌桌对诗，输的人负责买下一顿茶水，氛围组提前开嗓
    tagline: 输了没关系，诗背不出来才丢人

  - time_tc: 巳时
    time_m: "09:00"
    emoji: "🛒"
    title: 东西两市开市
    desc: 持开元通宝逛仿唐集市，摊位含香料铺、绢帛庄、胡人杂货、文房笔墨，可讨价还价
    tagline: 用铜钱砍价，比双十一更刺激

  - time_tc: 巳时中
    time_m: "10:00"
    emoji: "🧪"
    title: 市集体验坊
    desc: 三选一：①手工制香（带走香囊）②拓印团扇③染一块手帕，现场制作现场带走
    tagline: 全程手作，比买纪念品更有面子

  - time_tc: 午时
    time_m: "11:00"
    emoji: "🍜"
    title: 午食
    desc: 槐叶冷淘（绿色冷面）、羊肉蒸饼、清炖鱼羹，配葡萄酒或三勒浆，席间可点单加菜
    tagline: 李白喝的就是这杯

  - time_tc: 午时末
    time_m: "12:30"
    emoji: "😴"
    title: 午憩·茶室小坐
    desc: 唐人有午睡习惯，茶室提供蒲团、软枕、淡茶，可小憩、可闲聊、可看窗外庭院发呆
    tagline: 摸鱼一小时，古今皆如此

  - time_tc: 未时
    time_m: "13:00"
    emoji: "🎮"
    title: 雅局·三路任选
    desc: ①飞花令擂台赛（文艺路线）②双陆棋对局，以铜钱下注（赌徒路线）③拓印·抄经DIY（文创路线）
    tagline: 选你的大唐副本

  - time_tc: 申时
    time_m: "15:00"
    emoji: "🏇"
    title: 校场开放
    desc: 三选一：马球（双人对抗）、步射（弓箭靶场）、蹴鞠（组队对战），换缺胯袍上场，全程拍摄剪辑成短视频
    tagline: 王侯将相都在玩，你凭什么不试

  - time_tc: 申时末
    time_m: "16:30"
    emoji: "🏆"
    title: 校场擂台赛
    desc: 各项目胜者对决，围观者可押注铜钱，冠军获「本日唐人英雄」称号及特别礼品
    tagline: 赢了名留青史，输了名留糗史

  - time_tc: 酉时
    time_m: "17:00"
    emoji: "📸"
    title: 曲江·夕照打卡
    desc: 仿曲江池畔漫步，赏亭台水景，专属摄影师跟拍，黄金光线下成片率极高
    tagline: 这一刻不发朋友圈对不起这身行头

  - time_tc: 酉时中
    time_m: "18:00"
    emoji: "🌸"
    title: 曲江诗会
    desc: 以夕阳、流水、离别为题即兴作诗，现场评选「今日诗魁」，最差一首当众朗诵，全场监督
    tagline: 写不出来？罚酒一杯

  - time_tc: 戌时
    time_m: "19:00"
    emoji: "🍖"
    title: 晚宴·曲乐雅宴
    desc: 正式流水席：烤全羊、五香炙肉、蟹黄蒸饼、各色点心，席间歌舞表演，可点歌、可赏舞、可与乐伎互动
    tagline: 大唐版演唱会，座位费包含在票价里

  - time_tc: 戌时末
    time_m: "20:30"
    emoji: "🎶"
    title: 宴后·投壶博彩
    desc: 酒足饭饱后玩投壶，以铜钱押注，赢了换兑换券，输了再喝一杯，气氛永远在线
    tagline: 微醺状态下准头反而更好

  - time_tc: 亥时
    time_m: "21:00"
    emoji: "🏮"
    title: 夜市不打烊
    desc: 长安夜市开市：小吃摊、灯谜摊、手作伴手礼摊，用剩余铜钱消费，限时一小时
    tagline: 带着伴手礼和微醺回到现代

  - time_tc: 亥时末
    time_m: "22:00"
    emoji: "🌙"
    title: 散场·归坊
    desc: 换回现代服装，领取今日专属「唐人档案」（含全天照片、专属名帖、体验证书），坊门送别
    tagline: 你在唐朝活过这一天
